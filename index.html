<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Geneva Cam</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>

<body>

    <h1>Geneva Cam</h1>

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <div id="logoBox">
        <img
            id="logo"
            src="radiolac-logo.png"
            alt="Radio Lac">
        <button id="radio-toggle" class="power-btn" type="button" aria-label="Toggle Radio">
            <svg viewBox="0 0 24 24" class="power-icon">
                <path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/>
            </svg>
        </button>
        <span class="power-label"></span>
        <audio id="radio" preload="none" src="https://radiolac.ice.infomaniak.ch/radiolac-high.mp3"></audio>
    </div>

    <div id="clockBox">
        <div id="clock">
            00:00
        </div>
        <div id="date">
            Loading...
        </div>
        <div id="temperature">
            --°C
        </div>
        <div id="weather">
        </div>
        <button id="fullscreen-btn" type="button" aria-label="Plein écran" title="Plein écran">
            <svg class="fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
            <svg class="fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
        </button>
    </div>

    <div id="tickerContainer">
        <div id="ticker">
            Updating...
        </div>
    </div>

    <div id="credits">
        <span class="cr-sources">Sources :</span>
        <span class="cr-label">Webcam :</span>
        <a href="https://ww2.sig-ge.ch/" target="_blank" rel="noopener">SIG</a>
        &middot;
        <span class="cr-label">Radio :</span>
        <a href="https://www.radiolac.ch/" target="_blank" rel="noopener">Radio Lac</a>
        &middot;
        <span class="cr-label">Actualités :</span>
        <a href="https://www.letemps.ch/" target="_blank" rel="noopener">Le Temps</a>,
        <a href="https://www.20min.ch/fr" target="_blank" rel="noopener">20 Minutes</a>
        &middot;
        <span class="cr-label">Trafic :</span>
        <a href="https://transport.opendata.ch/" target="_blank" rel="noopener">Open Transport Data</a>
        &middot;
        <span class="cr-label">Météo :</span>
        <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open‑Meteo</a>
    </div>

    <!-- hls.js: plays the webcam stream in browsers without native HLS support -->
    <script
        src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"
        integrity="sha384-cciJ0zi8d1uMKC2zJd7jvPY4HQt7W4ByUI/FlMkltvBi31aW61rcpVBhpmW8/NwX"
        crossorigin="anonymous"></script>
    <script src="app.js"></script>

</body>

</html>
